<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#fbf6ee">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2214%22%20fill%3D%22%23b0432a%22%2F%3E%3Ccircle%20cx%3D%2232%22%20cy%3D%2228%22%20r%3D%2212%22%20fill%3D%22%23fbf6ee%22%2F%3E%3Cpath%20d%3D%22M10%2052%20L24%2038%20L32%2044%20L42%2032%20L54%2052%20Z%22%20fill%3D%22%23fbf6ee%22%20opacity%3D%22.9%22%2F%3E%3C%2Fsvg%3E">
<title>우리가족 일본가요</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700;800&family=Noto+Sans+KR:wght@400;500;700;800&family=Noto+Serif+KR:wght@700;800&display=swap">
<style>
/* 종이 여행 책자: 미색 종이 위에 얇은 가로선으로 구역을 나누고, 카드 상자는 꼭 필요한 곳에만 */
:root {
  --paper: #f8f3ea; /* 미색 종이 */
  --paper-2: #efe6d8; /* 한 톤 진한 종이 (입력 영역) */
  --ink: #2b2520; /* 먹색 본문 */
  --muted: #625649; /* 보조 글 (종이 위 대비 6:1 이상) */
  --rule: #d9cab4; /* 1px 구분선 */
  --terra: #a8432a; /* 테라코타 소제목·강조 */
  --terra-dark: #87331f;
  --terra-tint: #f3e0d4;
  --navy: #2d4766; /* 날씨·밤 */
  --white: #fffdf9;
  --serif: "Noto Serif KR", "Nanum Myeongjo", serif;
  --sans: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --ja: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif;
  --tabbar-h: 74px;
  color-scheme: light;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 18px;
  line-height: 1.75;
  word-break: keep-all;
  overflow-wrap: anywhere;
}
img { max-width: 100%; display: block; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
a { color: inherit; }
h1, h2, h3, h4 { text-wrap: balance; }
:focus-visible { outline: 3px solid var(--navy); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }

.app {
  max-width: 560px;
  margin: 0 auto;
  padding: 0 16px calc(var(--tabbar-h) + 24px + env(safe-area-inset-bottom));
  min-height: 100dvh;
}

/* ---------- 표지 ---------- */
.cover { padding: 32px 0 20px; }
.cover .date {
  margin: 0;
  font-size: 17px;
  font-weight: 700;
  color: var(--terra);
  font-variant-numeric: tabular-nums;
}
.cover h1 {
  font-family: var(--serif);
  font-size: clamp(30px, 8.6vw, 38px);
  line-height: 1.3;
  margin: 8px 0 0;
  font-weight: 800;
  letter-spacing: -0.01em;
}
.cover .countdown { margin: 10px 0 0; font-size: 17px; color: var(--muted); }

/* ---------- 사진 프레임 ---------- */
.photo { margin: 0; }
.photo img {
  width: 100%;
  aspect-ratio: 3 / 2;
  object-fit: cover;
  border-radius: 3px;
  background: var(--paper-2);
}
.photo figcaption {
  margin-top: 8px;
  font-size: 15px;
  line-height: 1.5;
  color: var(--muted);
}
.photo.hero img { aspect-ratio: 4 / 3; }

/* ---------- 구역 ---------- */
.section { margin-top: 32px; padding-top: 24px; border-top: 1px solid var(--rule); }
.kicker {
  display: block;
  font-size: 16px;
  font-weight: 700;
  color: var(--terra);
  letter-spacing: 0.02em;
  margin-bottom: 2px;
}
.section-title {
  font-family: var(--serif);
  font-size: 25px;
  line-height: 1.35;
  margin: 0 0 14px;
  font-weight: 800;
}
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.section-head .count { font-size: 16px; color: var(--muted); font-variant-numeric: tabular-nums; }

.page-title {
  font-family: var(--serif);
  font-size: 30px;
  line-height: 1.3;
  margin: 30px 0 6px;
  font-weight: 800;
}
.page-sub { margin: 0 0 20px; color: var(--muted); font-size: 17px; }

.muted { color: var(--muted); }
.small { font-size: 15px; line-height: 1.6; }

/* ---------- 항목 줄 (라벨 + 내용) ---------- */
.entries { margin: 0; }
.entry { padding: 14px 0; border-top: 1px solid var(--rule); }
.entry:first-child { border-top: 0; padding-top: 4px; }
.entry dt {
  font-size: 16px;
  font-weight: 700;
  color: var(--terra);
}
.entry dd { margin: 2px 0 0; font-size: 19px; font-weight: 600; line-height: 1.55; }
.entry dd .note { display: block; font-size: 17px; font-weight: 400; color: var(--muted); margin-top: 2px; }

/* ---------- 날짜 고르기 ---------- */
.day-chips {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  border: 1px solid var(--ink);
  border-radius: 4px;
  overflow: hidden;
  margin-bottom: 22px;
}
.day-chip {
  min-height: 64px;
  border: 0;
  border-left: 1px solid var(--ink);
  background: transparent;
  padding: 6px 2px;
  line-height: 1.25;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}
.day-chip:first-child { border-left: 0; }
.day-chip small { display: block; font-size: 14px; font-weight: 500; color: var(--muted); }
.day-chip .d { font-size: 17px; }
.day-chip .today { display: block; font-size: 13px; font-weight: 800; color: var(--terra); }
.day-chip[aria-pressed="true"] { background: var(--ink); color: var(--white); }
.day-chip[aria-pressed="true"] small { color: #ddd2c4; }
.day-chip[aria-pressed="true"] .today { color: #f4b49f; }

/* ---------- 버튼 ---------- */
.btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  width: 100%;
  min-height: 58px;
  padding: 12px 18px;
  border-radius: 6px;
  border: 1.5px solid transparent;
  font-size: 19px;
  font-weight: 700;
  text-decoration: none;
  line-height: 1.3;
  text-align: center;
}
.btn-primary { background: var(--terra); color: var(--white); }
.btn-primary:active { background: var(--terra-dark); }
.btn-dark { background: var(--ink); color: var(--white); }
.btn-line { background: transparent; border-color: var(--ink); color: var(--ink); }
.btn-soft { background: var(--paper-2); color: var(--ink); }
.btn:disabled { opacity: 0.5; }
.btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.btn .sub { display: block; font-size: 15px; font-weight: 500; opacity: 0.85; }

.link-more {
  display: flex;
  justify-content: space-between;
  align-items: center;
  width: 100%;
  min-height: 56px;
  margin-top: 8px;
  padding: 0;
  border: 0;
  border-top: 1px solid var(--rule);
  border-bottom: 1px solid var(--rule);
  background: transparent;
  font-size: 18px;
  font-weight: 700;
  color: var(--terra);
  text-align: left;
}

/* ---------- 앨범 ---------- */
.album-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 16px; }
.album-grid button {
  padding: 0;
  border: 0;
  border-radius: 2px;
  overflow: hidden;
  aspect-ratio: 1;
  background: var(--paper-2);
}
.album-grid img { width: 100%; height: 100%; object-fit: cover; }
.album-empty {
  margin-top: 16px;
  padding: 26px 16px;
  border: 1px dashed var(--rule);
  text-align: center;
  color: var(--muted);
}
.notice { margin: 12px 0 0; padding: 10px 0; border-top: 1px solid var(--rule); color: var(--navy); font-weight: 600; }
.notice.error { color: #8a2414; }

.panel { background: var(--paper-2); border-radius: 4px; padding: 18px 16px; }

.viewer {
  position: fixed;
  inset: 0;
  z-index: 50;
  background: #17110d;
  display: flex;
  flex-direction: column;
  padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
}
.viewer-top, .viewer-bottom { display: flex; gap: 10px; padding: 12px 16px; }
.viewer-top { justify-content: space-between; align-items: center; color: #f3ece2; font-size: 16px; }
.viewer-img { flex: 1; min-height: 0; display: grid; place-items: center; padding: 0 8px; }
.viewer-img img { max-height: 100%; width: auto; object-fit: contain; }
.viewer .btn { min-height: 56px; }
.viewer .btn-soft { background: #3a302a; color: #f3ece2; }
.viewer-close { width: auto; min-width: 104px; }
.viewer-delete { background: transparent; color: #f0b9aa; border-color: #6e4537; font-size: 17px; }
.confirm { padding: 0 16px 12px; color: #f3ece2; }
.confirm p { margin: 0 0 10px; font-weight: 700; }

/* ---------- 날씨·옷차림 (글 안내) ---------- */
.weather { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin-bottom: 6px; }
.weather .temp {
  font-family: var(--serif);
  font-size: 30px;
  font-weight: 800;
  color: var(--navy);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.weather .sky { font-size: 18px; font-weight: 600; color: var(--navy); }

/* ---------- 장소·음식 ---------- */
.item { padding: 22px 0; border-top: 1px solid var(--rule); }
.item:first-of-type { border-top: 0; padding-top: 4px; }
.item h4 { margin: 0 0 6px; font-size: 21px; line-height: 1.45; font-weight: 800; }
.item p { margin: 0; color: #43392f; }
.item .photo { margin-bottom: 14px; }
.item .when { font-size: 16px; font-weight: 700; color: var(--terra); display: block; margin-bottom: 2px; }
.highlight {
  margin-top: 12px !important;
  padding: 10px 0 10px 14px;
  border-left: 3px solid var(--terra);
  color: var(--terra-dark) !important;
  font-weight: 700;
}

.day-head { margin: 0 0 4px; }
.day-head .kicker { font-variant-numeric: tabular-nums; }
.day-title { font-family: var(--serif); font-size: 27px; line-height: 1.35; margin: 0; font-weight: 800; }

/* ---------- 일본어 ---------- */
.phrase { padding: 24px 0; border-top: 1px solid var(--rule); }
.phrase:first-of-type { border-top: 0; padding-top: 4px; }
.phrase .ko { font-size: 18px; font-weight: 700; color: var(--muted); }
.phrase .num { color: var(--terra); margin-right: 6px; font-variant-numeric: tabular-nums; }
.phrase .ja {
  font-family: var(--ja);
  font-size: 30px;
  line-height: 1.4;
  font-weight: 700;
  margin: 6px 0 4px;
}
.phrase .say { font-size: 20px; color: var(--terra); font-weight: 700; }
.phrase .btn-row { margin-top: 14px; }
.phrase .btn { min-height: 56px; font-size: 18px; }

.showcase {
  position: fixed;
  inset: 0;
  z-index: 60;
  background: var(--white);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 24px 20px calc(24px + env(safe-area-inset-bottom));
  text-align: center;
  gap: 18px;
}
.showcase .ja { font-family: var(--ja); font-size: clamp(40px, 12vw, 64px); line-height: 1.35; font-weight: 800; }
.showcase .ko { font-size: 22px; color: var(--muted); }
.showcase .btn { max-width: 360px; }

/* ---------- 엔화 계산기 ---------- */
.calc-display {
  border-top: 2px solid var(--ink);
  border-bottom: 2px solid var(--ink);
  padding: 14px 2px;
  text-align: right;
  font-variant-numeric: tabular-nums;
}
.calc-display .yen { font-size: 24px; font-weight: 700; color: var(--muted); }
.calc-display .krw {
  font-family: var(--serif);
  font-size: clamp(38px, 11vw, 50px);
  line-height: 1.2;
  font-weight: 800;
  margin-top: 2px;
}
.calc-display .krw small { font-size: 0.5em; font-weight: 700; }
.calc-display .rate { font-size: 15px; color: var(--muted); margin-top: 6px; text-align: left; }

.quick { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 16px 0 10px; }
.quick button {
  min-height: 56px;
  border-radius: 6px;
  border: 1.5px solid var(--terra);
  background: transparent;
  color: var(--terra-dark);
  font-weight: 800;
  font-size: 18px;
  font-variant-numeric: tabular-nums;
}
.quick button.reset { background: var(--ink); border-color: var(--ink); color: var(--white); }
.keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.keypad button {
  min-height: 64px;
  border-radius: 6px;
  border: 0;
  background: var(--white);
  font-size: 28px;
  font-weight: 700;
  box-shadow: inset 0 0 0 1px var(--rule);
}
.keypad button:active { background: var(--paper-2); }
.keypad .fn { font-size: 18px; background: var(--paper-2); box-shadow: none; }
.keypad .danger { color: var(--terra); }

.rate-edit { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 10px; }
.rate-edit input {
  flex: 1;
  min-width: 120px;
  min-height: 56px;
  border-radius: 6px;
  border: 1.5px solid var(--rule);
  padding: 0 14px;
  font-size: 20px;
  background: var(--white);
}
.rate-edit .btn { width: auto; min-width: 96px; }

.check-item {
  display: flex;
  gap: 14px;
  width: 100%;
  text-align: left;
  border: 0;
  border-top: 1px solid var(--rule);
  background: transparent;
  padding: 18px 0;
}
.check-item:first-of-type { border-top: 0; padding-top: 4px; }
.check-box {
  flex: none;
  width: 32px;
  height: 32px;
  margin-top: 3px;
  border-radius: 4px;
  border: 2px solid var(--muted);
  display: grid;
  place-items: center;
  font-size: 19px;
  font-weight: 900;
  color: var(--white);
}
.check-item[aria-pressed="true"] .check-box { background: var(--terra); border-color: var(--terra); }
.check-item .ct { display: block; font-size: 20px; font-weight: 800; margin: 0 0 4px; line-height: 1.45; }
.check-item .cd { display: block; color: #43392f; }

/* ---------- 암호 ---------- */
.gate-dots { display: flex; justify-content: center; gap: 12px; margin: 12px 0 16px; }
.gate-dots span { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--ink); }
.gate-dots span.on { background: var(--ink); }

/* ---------- 하단 탭 ---------- */
.tabbar {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 40;
  background: var(--white);
  border-top: 1px solid var(--rule);
  padding-bottom: env(safe-area-inset-bottom);
}
.tabbar-inner { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); }
.tabbar button {
  min-height: var(--tabbar-h);
  border: 0;
  border-top: 3px solid transparent;
  background: transparent;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  font-size: 15px;
  font-weight: 700;
  color: var(--muted);
  padding: 4px 2px 6px;
  line-height: 1.2;
}
.tabbar button svg { width: 28px; height: 28px; }
.tabbar button[aria-current="page"] { color: var(--terra); border-top-color: var(--terra); }

.colophon {
  margin-top: 36px;
  padding-top: 18px;
  border-top: 1px solid var(--rule);
  text-align: center;
  font-size: 15px;
  line-height: 1.6;
  color: var(--muted);
}
.colophon .credit { font-size: 13px; margin-top: 6px; }

.app { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.tabbar { padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.preview-banner { background: var(--navy); color: #fff; text-align: center; font-size: 15px; font-weight: 700; padding: 8px max(16px, env(safe-area-inset-left, 0px)); }
</style>
</head>
<body>
<div class="preview-banner">미리보기 화면이에요 · 가족 사진 앨범은 곧 열려요</div>
