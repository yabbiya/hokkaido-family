<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#fbf6ee">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2214%22%20fill%3D%22%23b0432a%22%2F%3E%3Ccircle%20cx%3D%2232%22%20cy%3D%2228%22%20r%3D%2212%22%20fill%3D%22%23fbf6ee%22%2F%3E%3Cpath%20d%3D%22M10%2052%20L24%2038%20L32%2044%20L42%2032%20L54%2052%20Z%22%20fill%3D%22%23fbf6ee%22%20opacity%3D%22.9%22%2F%3E%3C%2Fsvg%3E">
<title>우리가족 일본가요</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700;800&family=Noto+Sans+KR:wght@400;500;700;800&family=Noto+Serif+KR:wght@700;800&display=swap">
<style>
:root {
  --bg: #fbf6ee;
  --surface: #ffffff;
  --surface-2: #f5ede1;
  --ink: #2a2420;
  --muted: #62564d;
  --line: #e6d9c8;
  --accent: #b0432a; /* 아카렌가 벽돌색 */
  --accent-ink: #ffffff;
  --accent-soft: #f7e3d8;
  --navy: #2d4766; /* 눈 내린 밤 */
  --navy-soft: #e3eaf3;
  --green: #2f6b4f;
  --shadow: 0 1px 2px rgba(60, 40, 20, 0.06), 0 6px 18px rgba(60, 40, 20, 0.07);
  --radius: 18px;
  --serif: "Noto Serif KR", "Nanum Myeongjo", serif;
  --sans: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --ja: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif;
  --tabbar-h: 76px;
  color-scheme: light;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 18px;
  line-height: 1.7;
  word-break: keep-all;
  overflow-wrap: anywhere;
}
img { max-width: 100%; display: block; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--navy); outline-offset: 2px; }

.app {
  max-width: 560px;
  margin: 0 auto;
  padding: 0 16px calc(var(--tabbar-h) + 28px + env(safe-area-inset-bottom));
  min-height: 100dvh;
}

/* ---------- 머리말 ---------- */
.masthead { padding: 28px 0 8px; text-align: center; }
.masthead .kicker {
  display: inline-block;
  font-size: 15px;
  letter-spacing: 0.12em;
  color: var(--accent);
  font-weight: 700;
}
.masthead h1 {
  font-family: var(--serif);
  font-size: 30px;
  line-height: 1.35;
  margin: 6px 0 8px;
  font-weight: 800;
}
.masthead .period { margin: 0; font-size: 18px; color: var(--muted); font-weight: 500; }
.status-pill {
  display: inline-block;
  margin-top: 12px;
  padding: 6px 16px;
  border-radius: 999px;
  background: var(--accent-soft);
  color: var(--accent);
  font-weight: 700;
  font-size: 17px;
}

.page-title {
  font-family: var(--serif);
  font-size: 26px;
  margin: 26px 0 4px;
  font-weight: 800;
}
.page-sub { margin: 0 0 16px; color: var(--muted); font-size: 17px; }

.section { margin-top: 28px; }
.section-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 8px;
  margin: 0 0 12px;
}
.section-head h2 {
  font-family: var(--serif);
  font-size: 23px;
  margin: 0;
  font-weight: 800;
}
.section-head .hint { font-size: 15px; color: var(--muted); }

/* ---------- 카드 ---------- */
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 18px;
}
.card + .card { margin-top: 12px; }
.card h3 { margin: 0 0 4px; font-size: 20px; line-height: 1.45; }
.card p { margin: 0; }
.label {
  display: inline-block;
  font-size: 15px;
  font-weight: 700;
  color: var(--accent);
  margin-bottom: 4px;
  letter-spacing: 0.02em;
}
.muted { color: var(--muted); }

.info-row { display: flex; gap: 12px; align-items: flex-start; }
.info-row + .info-row { margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--line); }
.info-row .ico {
  flex: none;
  width: 44px;
  height: 44px;
  border-radius: 12px;
  display: grid;
  place-items: center;
  background: var(--surface-2);
  font-size: 24px;
}
.info-row .body { min-width: 0; flex: 1; }
.info-row strong { display: block; font-size: 19px; line-height: 1.5; }

.highlight {
  margin-top: 10px;
  padding: 12px 14px;
  border-radius: 12px;
  background: var(--accent-soft);
  color: #7e2c18;
  font-weight: 700;
}

/* ---------- 날짜 칩 ---------- */
.day-chips {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  margin-bottom: 14px;
}
.day-chip {
  min-height: 64px;
  border-radius: 14px;
  border: 2px solid var(--line);
  background: var(--surface);
  padding: 6px 2px;
  line-height: 1.25;
  font-weight: 700;
}
.day-chip small { display: block; font-size: 14px; font-weight: 500; color: var(--muted); }
.day-chip .d { font-size: 17px; }
.day-chip[aria-pressed="true"] {
  background: var(--ink);
  border-color: var(--ink);
  color: #fff;
}
.day-chip[aria-pressed="true"] small { color: #e9dfd3; }
.day-chip .today-dot {
  display: block;
  font-size: 12px;
  color: var(--accent);
  font-weight: 800;
}
.day-chip[aria-pressed="true"] .today-dot { color: #ffb59e; }

/* ---------- 버튼 ---------- */
.btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  width: 100%;
  min-height: 60px;
  padding: 12px 18px;
  border-radius: 16px;
  border: 2px solid transparent;
  font-size: 19px;
  font-weight: 700;
  text-decoration: none;
  line-height: 1.3;
  text-align: center;
}
.btn-primary { background: var(--accent); color: var(--accent-ink); }
.btn-primary:active { background: #8f3520; }
.btn-dark { background: var(--ink); color: #fff; }
.btn-outline { background: var(--surface); border-color: var(--ink); color: var(--ink); }
.btn-ghost { background: var(--surface-2); color: var(--ink); }
.btn:disabled { opacity: 0.55; }
.btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.papago {
  background: #1fbe5f;
  color: #08331a;
  min-height: 76px;
  font-size: 21px;
  border-radius: 18px;
}
.papago small { display: block; font-size: 15px; font-weight: 600; }

/* ---------- 앨범 ---------- */
.album-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-top: 14px;
}
.album-grid button {
  padding: 0;
  border: 0;
  border-radius: 12px;
  overflow: hidden;
  aspect-ratio: 1;
  background: var(--surface-2);
}
.album-grid img { width: 100%; height: 100%; object-fit: cover; }
.album-empty {
  margin-top: 14px;
  padding: 28px 16px;
  border: 2px dashed var(--line);
  border-radius: 14px;
  text-align: center;
  color: var(--muted);
}
.notice {
  margin-top: 12px;
  padding: 12px 14px;
  border-radius: 12px;
  background: var(--navy-soft);
  color: var(--navy);
  font-weight: 600;
}
.notice.error { background: #fbe4e0; color: #8a2414; }

.viewer {
  position: fixed;
  inset: 0;
  z-index: 50;
  background: rgba(20, 14, 10, 0.96);
  display: flex;
  flex-direction: column;
  padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
}
.viewer-top, .viewer-bottom {
  display: flex;
  gap: 10px;
  padding: 12px 16px;
}
.viewer-top { justify-content: space-between; align-items: center; color: #fff; }
.viewer-img { flex: 1; min-height: 0; display: grid; place-items: center; padding: 0 8px; }
.viewer-img img { max-height: 100%; width: auto; object-fit: contain; border-radius: 6px; }
.viewer .btn { min-height: 56px; }
.viewer-close { width: auto; min-width: 110px; }

/* ---------- 옷차림 ---------- */
.outfits { display: grid; gap: 12px; }
.outfit {
  display: flex;
  gap: 14px;
  align-items: center;
  padding: 14px;
  border-radius: 14px;
  background: var(--surface-2);
}
.outfit.rain { background: #e7eef5; }
.outfit.snow { background: var(--navy-soft); }
.outfit.indoor { background: #f7ead9; }
.outfit img {
  flex: none;
  width: 96px;
  height: 96px;
  object-fit: contain;
  border-radius: 10px;
  background: #fff;
}
.outfit .tag { font-size: 15px; font-weight: 800; color: var(--navy); }
.outfit p { font-size: 18px; font-weight: 600; }

.weather {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 14px;
  border-radius: 14px;
  background: var(--navy);
  color: #fff;
  margin-bottom: 12px;
}
.weather .temp { font-size: 28px; font-weight: 800; font-family: var(--serif); white-space: nowrap; }
.weather .sky { font-size: 18px; font-weight: 600; line-height: 1.45; }

.place + .place { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--line); }
.place h4, .meal h4 { margin: 0 0 4px; font-size: 20px; line-height: 1.45; }
.place p, .meal p { color: #4a3f37; }
.meal + .meal { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); }
.meal .when {
  display: inline-block;
  font-size: 14px;
  font-weight: 800;
  padding: 2px 10px;
  border-radius: 999px;
  background: var(--accent-soft);
  color: var(--accent);
  margin-bottom: 4px;
}

.day-title { font-family: var(--serif); font-size: 24px; margin: 4px 0 2px; font-weight: 800; }
.block-title {
  font-size: 18px;
  font-weight: 800;
  margin: 22px 0 10px;
  display: flex;
  align-items: center;
  gap: 8px;
}

/* ---------- 일본어 ---------- */
.phrase .ko { font-size: 19px; font-weight: 700; color: var(--muted); }
.phrase .ja {
  font-family: var(--ja);
  font-size: 30px;
  line-height: 1.4;
  font-weight: 700;
  margin: 6px 0 4px;
  color: var(--ink);
}
.phrase .say { font-size: 20px; color: var(--accent); font-weight: 700; }
.phrase .btn-row { margin-top: 14px; }
.phrase .btn { min-height: 56px; font-size: 18px; }

.showcase {
  position: fixed;
  inset: 0;
  z-index: 60;
  background: #fffdf8;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 24px 20px calc(24px + env(safe-area-inset-bottom));
  text-align: center;
  gap: 18px;
}
.showcase .ja { font-family: var(--ja); font-size: clamp(40px, 12vw, 64px); line-height: 1.35; font-weight: 800; }
.showcase .ko { font-size: 22px; color: var(--muted); }
.showcase .btn { max-width: 360px; }

/* ---------- 엔화 계산기 ---------- */
.calc-display {
  background: var(--ink);
  color: #fff;
  border-radius: var(--radius);
  padding: 18px 18px 16px;
  text-align: right;
}
.calc-display .yen { font-size: 26px; font-weight: 700; color: #e9dfd3; }
.calc-display .krw {
  font-size: clamp(36px, 11vw, 48px);
  line-height: 1.2;
  font-weight: 800;
  font-family: var(--serif);
  margin-top: 4px;
}
.calc-display .krw small { font-size: 0.55em; font-weight: 700; }
.calc-display .rate { font-size: 15px; color: #cfc3b5; margin-top: 8px; }

.quick {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin: 12px 0;
}
.quick button {
  min-height: 56px;
  border-radius: 14px;
  border: 2px solid var(--accent);
  background: var(--accent-soft);
  color: #7e2c18;
  font-weight: 800;
  font-size: 18px;
}
.keypad {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}
.keypad button {
  min-height: 66px;
  border-radius: 14px;
  border: 1px solid var(--line);
  background: var(--surface);
  font-size: 28px;
  font-weight: 700;
  box-shadow: 0 1px 0 var(--line);
}
.keypad button:active { background: var(--surface-2); }
.keypad .fn { font-size: 19px; background: var(--surface-2); }
.keypad .danger { color: var(--accent); }

.rate-edit { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 12px; }
.rate-edit input {
  flex: 1;
  min-width: 120px;
  min-height: 56px;
  border-radius: 12px;
  border: 2px solid var(--line);
  padding: 0 14px;
  font-size: 20px;
  background: #fff;
}
.rate-edit .btn { width: auto; min-width: 100px; }

.check-item {
  display: flex;
  gap: 14px;
  width: 100%;
  text-align: left;
  border: 0;
  background: transparent;
  padding: 0;
}
.check-box {
  flex: none;
  width: 34px;
  height: 34px;
  margin-top: 2px;
  border-radius: 10px;
  border: 2px solid var(--muted);
  display: grid;
  place-items: center;
  font-size: 20px;
  font-weight: 900;
  color: #fff;
  background: #fff;
}
.check-item[aria-pressed="true"] .check-box { background: var(--green); border-color: var(--green); }
.check-item h3 { font-size: 20px; margin: 0 0 4px; }
.check-item p { color: #4a3f37; }

/* ---------- 암호 ---------- */
.gate-dots { display: flex; justify-content: center; gap: 12px; margin: 10px 0 16px; }
.gate-dots span {
  width: 20px;
  height: 20px;
  border-radius: 50%;
  border: 2px solid var(--ink);
}
.gate-dots span.on { background: var(--ink); }

/* ---------- 하단 탭 ---------- */
.tabbar {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 40;
  background: rgba(255, 253, 249, 0.97);
  border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom);
  box-shadow: 0 -4px 18px rgba(60, 40, 20, 0.06);
}
.tabbar-inner {
  max-width: 560px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
}
.tabbar button {
  min-height: var(--tabbar-h);
  border: 0;
  background: transparent;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  font-size: 15px;
  font-weight: 700;
  color: var(--muted);
  padding: 6px 2px;
  line-height: 1.2;
}
.tabbar button svg { width: 30px; height: 30px; }
.tabbar button[aria-current="page"] { color: var(--accent); }
.tabbar button[aria-current="page"] .tab-ico {
  background: var(--accent-soft);
}
.tab-ico { padding: 3px 14px; border-radius: 999px; display: grid; place-items: center; }

.footer-note { margin-top: 28px; text-align: center; font-size: 15px; color: var(--muted); }

.app { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.tabbar { padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.preview-banner { background: var(--navy); color: #fff; text-align: center; font-size: 15px; font-weight: 700; padding: 8px max(16px, env(safe-area-inset-left, 0px)); }
</style>
</head>
<body>
<div class="preview-banner">미리보기 화면이에요 · 가족 사진 앨범은 곧 열려요</div>
