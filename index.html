<title>조가네 일본가유</title>
<meta name="claude:viewport-fit-sides" content="cover">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700;800&family=Noto+Sans+KR:wght@400;500;700;800&family=Noto+Serif+KR:wght@400;600;700&display=swap">
<style>
/* 여행 잡지: 미색 종이 위에 1px 가로선으로만 구역을 나눔. 흰 상자·그림자·둥근 카드 없음.
   모서리는 0~2px, 누르는 버튼·키패드만 최대 4px */
:root {
  --paper: #faf7f2; /* 미색 종이 */
  --paper-2: #f1ebe1; /* 한 톤 진한 종이 (입력·누름 상태) */
  --ink: #1f1e1b; /* 먹색 본문 */
  --muted: #5e554b; /* 보조 글 (종이 위 대비 7:1) */
  --rule: #dad1c4; /* 1px 구분선 */
  --terra: #a33b20; /* 테라코타 라벨·강조 */
  --terra-dark: #842f19;
  --terra-tint: #f4e4da;
  --navy: #1f3044; /* 짙은 네이비: 제목·선택 표시 */
  --white: #fffdf9;
  --r-btn: 4px; /* 버튼·키패드 모서리 */
  --r: 2px; /* 그 밖의 모서리 */
  --serif: "Noto Serif KR", "Nanum Myeongjo", serif;
  --sans: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --ja: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif;
  --tabbar-h: 74px;
  --bar: #f4efe7; /* 상단 글자 크기 바 */
  /* 글자 크기 배율: 본문·일정·설명·일본어 카드·체크리스트에만 적용.
     날짜 칸·하단 탭·키패드·상단 바는 px 고정이라 글씨를 키워도 밀리지 않음 */
  --font-scale: 1;
  color-scheme: only light; /* 폰이 다크모드여도 밝은 미색 화면 고정 */
}
html[data-fs="sm"] { --font-scale: 0.9; }
html[data-fs="lg"] { --font-scale: 1.22; }

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; background: var(--paper); }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  font-size: calc(18px * var(--font-scale)); /* 유연 구역의 기본 글자 */
  line-height: 1.75;
  word-break: keep-all;
  overflow-wrap: anywhere;
}
img { max-width: 100%; display: block; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
a { color: inherit; }
h1, h2, h3, h4 { text-wrap: balance; }
:focus-visible { outline: 3px solid var(--navy); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }

.app {
  max-width: 560px;
  margin: 0 auto;
  padding: 0 16px calc(var(--tabbar-h) + 24px + env(safe-area-inset-bottom));
  min-height: 100dvh;
}

/* ---------- 홈 표지: 가운데 정렬 여행 책자 표지 ----------
   위 2px 네이비 선 → 날짜 라벨 → 명조 제목 2줄 → 부제 → 아래 1px 선 → 사진 */
/* 표지 선 바로 위 오른쪽 작은 제작자 표기 (크기 고정) */
.cover-credit {
  margin: 14px 8px 6px;
  text-align: right;
  font-size: 12px;
  line-height: 1.4;
  letter-spacing: 0.14em;
  color: #696258;
}
.cover {
  margin: 0 8px 22px;
  padding: 22px 0 20px;
  border-top: 2px solid var(--navy);
  border-bottom: 1px solid var(--rule);
  text-align: center;
}
.cover-date {
  margin: 0;
  font-size: calc(16px * var(--font-scale));
  font-weight: 500;
  color: var(--terra);
  font-variant-numeric: tabular-nums;
  line-height: 1.5;
}
.cover h1 {
  font-family: var(--serif);
  /* 글자 크기 배율을 따르되, "사랑스런 조가네"(약 7.4글자 폭)가 화면 폭을 넘지 않게 상한 */
  font-size: max(30px, min(calc(40px * var(--font-scale)), calc((100vw - 56px) / 7.4), 52px));
  line-height: 1.28;
  margin: 10px 0 0;
  font-weight: 600; /* 굵은 고딕 느낌이 나지 않게 600 */
  color: var(--navy);
  letter-spacing: -0.01em;
}
.cover h1 span { display: block; white-space: nowrap; } /* "사랑스런 조가네 / 일본가유" 2줄 고정 */
.cover-date .nw { display: inline-block; white-space: nowrap; } /* 줄을 바꿔야 하면 "·" 자리에서만 */
.cover-sub {
  margin: 12px 0 0;
  font-size: calc(18px * var(--font-scale));
  color: #696258;
  line-height: 1.5;
}

/* ---------- 맨 위 고정 띠: 글자 크기 (크기 고정 구역) ---------- */
.fs-bar {
  position: sticky;
  top: 0;
  z-index: 45;
  background: var(--bar);
  border-bottom: 1px solid var(--rule);
  padding-top: env(safe-area-inset-top, 0px);
}
.fs-bar-inner {
  max-width: 560px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 4px 16px;
}
.fs-label { font-size: 15px; font-weight: 700; color: var(--muted); white-space: nowrap; line-height: 1.2; }
.fs-seg {
  display: grid;
  grid-template-columns: repeat(3, 60px);
  border: 1px solid var(--navy);
  border-radius: var(--r-btn);
  overflow: hidden;
  flex: none;
}
.fs-seg button {
  min-height: 48px;
  border: 0;
  border-left: 1px solid var(--navy);
  background: transparent;
  font-weight: 700;
  line-height: 1;
  white-space: nowrap;
  padding: 0;
}
.fs-seg button:first-child { border-left: 0; }
.fs-seg button[aria-pressed="true"] { background: var(--navy); color: var(--white); }

/* ---------- 사진 프레임 ---------- */
.photo { margin: 0; }
.photo img {
  width: 100%;
  aspect-ratio: 3 / 2;
  object-fit: cover;
  border-radius: var(--r);
  background: var(--paper-2);
}
.photo figcaption {
  margin-top: 8px;
  font-size: calc(15px * var(--font-scale));
  line-height: 1.5;
  color: var(--muted);
}
.photo.hero img { aspect-ratio: 4 / 3; }

/* ---------- 구역 ---------- */
.section { margin-top: 32px; padding-top: 24px; border-top: 1px solid var(--rule); }
.kicker {
  display: block;
  font-size: 16px;
  font-weight: 700;
  color: var(--terra);
  letter-spacing: 0.06em;
  margin-bottom: 2px;
  font-variant-numeric: tabular-nums;
}
.section-title {
  font-family: var(--serif);
  font-size: 25px;
  line-height: 1.35;
  margin: 0 0 14px;
  font-weight: 800;
  color: var(--navy);
}
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.section-head .count { font-size: 16px; color: var(--muted); font-variant-numeric: tabular-nums; }

.page-title {
  font-family: var(--serif);
  font-size: 30px;
  line-height: 1.3;
  margin: 30px 0 6px;
  font-weight: 800;
  color: var(--navy);
}
.page-sub { margin: 0 0 20px; color: var(--muted); font-size: calc(17px * var(--font-scale)); }

.muted { color: var(--muted); }
.small { font-size: calc(15px * var(--font-scale)); line-height: 1.6; }

/* ---------- 항목 줄 (라벨 + 내용) ---------- */
.entries { margin: 0; }
.entry { padding: 14px 0; border-top: 1px solid var(--rule); }
.entry:first-child { border-top: 0; padding-top: 4px; }
.entry dt {
  font-size: calc(16px * var(--font-scale));
  font-weight: 700;
  color: var(--terra);
}
.entry dd { margin: 2px 0 0; font-size: calc(19px * var(--font-scale)); font-weight: 600; line-height: 1.55; }
.entry dd .note {
  display: block;
  font-size: calc(17px * var(--font-scale));
  font-weight: 400;
  color: var(--muted);
  margin-top: 2px;
}

/* ---------- 날짜 고르기: 가로줄 위 글자 + 고른 날짜 아래 진한 밑줄 ---------- */
.day-chips {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  border-top: 1px solid var(--rule);
  border-bottom: 1px solid var(--rule);
  margin-bottom: 22px;
}
/* 날짜 4칸: 크기 고정 + 줄바꿈 금지 (360px 폭에서 칸당 약 80px) */
.day-chip {
  position: relative;
  min-width: 0;
  min-height: 64px;
  border: 0;
  border-radius: 0;
  background: transparent;
  padding: 8px 0 10px;
  font-size: 16px;
  line-height: 1.25;
  font-weight: 700;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.day-chip small { display: block; font-size: 15px; font-weight: 600; }
.day-chip .d { display: block; font-size: 16px; letter-spacing: -0.03em; }
.day-chip .today { display: block; font-size: 13px; font-weight: 800; color: var(--terra); }
.day-chip[aria-pressed="true"] { color: var(--navy); }
.day-chip[aria-pressed="true"] small { font-weight: 800; }
.day-chip[aria-pressed="true"]::after {
  content: "";
  position: absolute;
  left: 14%;
  right: 14%;
  bottom: -1px; /* 아래 가로줄 위에 겹쳐 그림 */
  height: 3px;
  background: var(--navy);
}
.day-chip:active { background: var(--paper-2); }

/* ---------- 버튼 ---------- */
.btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  width: 100%;
  min-height: 58px;
  padding: 12px 18px;
  border-radius: var(--r-btn);
  border: 1.5px solid transparent;
  font-size: 19px;
  font-weight: 700;
  text-decoration: none;
  line-height: 1.3;
  text-align: center;
}
.btn-primary { background: var(--terra); color: var(--white); }
.btn-primary:active { background: var(--terra-dark); }
.btn-dark { background: var(--navy); color: var(--white); }
.btn-line { background: transparent; border-color: var(--ink); color: var(--ink); }
.btn-soft { background: var(--paper-2); color: var(--ink); }
.btn:disabled { opacity: 0.5; }
.btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.btn .sub { display: block; font-size: 15px; font-weight: 500; opacity: 0.85; }

.link-more {
  display: flex;
  justify-content: space-between;
  align-items: center;
  width: 100%;
  min-height: 56px;
  margin-top: 8px;
  padding: 0;
  border: 0;
  border-top: 1px solid var(--rule);
  border-bottom: 1px solid var(--rule);
  background: transparent;
  font-size: 18px;
  font-weight: 700;
  color: var(--terra);
  text-align: left;
}

/* ---------- 앨범 ---------- */
.album-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 16px; }
.album-grid button {
  padding: 0;
  border: 0;
  border-radius: 2px;
  overflow: hidden;
  aspect-ratio: 1;
  background: var(--paper-2);
}
.album-grid img { width: 100%; height: 100%; object-fit: cover; }
.album-empty {
  margin-top: 16px;
  padding: 26px 16px;
  border: 1px dashed var(--rule);
  text-align: center;
  color: var(--muted);
}
.notice { margin: 12px 0 0; padding: 10px 0; border-top: 1px solid var(--rule); color: var(--navy); font-weight: 600; }
.notice.error { color: #8a2414; }

.panel { border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); padding: 18px 0; } /* 상자 대신 위아래 선 */

.viewer {
  position: fixed;
  inset: 0;
  z-index: 50;
  background: #17110d;
  display: flex;
  flex-direction: column;
  padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
}
.viewer-top, .viewer-bottom { display: flex; gap: 10px; padding: 12px 16px; }
.viewer-top { justify-content: space-between; align-items: center; color: #f3ece2; font-size: 16px; }
.viewer-img { flex: 1; min-height: 0; display: grid; place-items: center; padding: 0 8px; }
.viewer-img img { max-height: 100%; width: auto; object-fit: contain; }
.viewer .btn { min-height: 56px; }
.viewer .btn-soft { background: #3a302a; color: #f3ece2; }
.viewer-close { width: auto; min-width: 104px; }
.viewer-delete { background: transparent; color: #f0b9aa; border-color: #6e4537; font-size: 17px; }
.confirm { padding: 0 16px 12px; color: #f3ece2; }
.confirm p { margin: 0 0 10px; font-weight: 700; }

/* ---------- 날씨·옷차림 (글 안내) ---------- */
.weather { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin-bottom: 6px; }
.weather .temp {
  font-family: var(--serif);
  font-size: calc(30px * var(--font-scale));
  font-weight: 800;
  color: var(--navy);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.weather .sky { font-size: calc(18px * var(--font-scale)); font-weight: 600; color: var(--navy); }

/* ---------- 장소·음식 ---------- */
.item { padding: 22px 0; border-top: 1px solid var(--rule); }
.item:first-of-type { border-top: 0; padding-top: 4px; }
.item h4 { margin: 0 0 6px; font-family: var(--serif); font-size: calc(23px * var(--font-scale)); line-height: 1.4; font-weight: 800; color: var(--navy); }
.item p { margin: 0; color: #43392f; }
.item .photo { margin-bottom: 14px; }
.item .when { font-size: calc(16px * var(--font-scale)); font-weight: 700; color: var(--terra); display: block; margin-bottom: 2px; }
.highlight {
  margin-top: 12px !important;
  padding: 10px 0 10px 14px;
  border-left: 3px solid var(--terra);
  color: var(--terra-dark) !important;
  font-weight: 700;
}

.day-head { margin: 0 0 4px; }
.day-head .kicker { font-variant-numeric: tabular-nums; }
.day-title { font-family: var(--serif); font-size: 27px; line-height: 1.35; margin: 0; font-weight: 800; color: var(--navy); }

/* ---------- 일본어 ---------- */
.phrase { padding: 24px 0; border-top: 1px solid var(--rule); }
.phrase:first-of-type { border-top: 0; padding-top: 4px; }
.phrase .ko { font-size: calc(18px * var(--font-scale)); font-weight: 700; color: var(--muted); }
.phrase .num { color: var(--terra); margin-right: 6px; font-variant-numeric: tabular-nums; }
.phrase .ja {
  font-family: var(--ja);
  font-size: calc(30px * var(--font-scale));
  line-height: 1.4;
  font-weight: 700;
  margin: 6px 0 4px;
  /* 일본어는 띄어쓰기가 없어서, 문장 데이터에 표시한 어절 경계(<wbr>)에서만 줄을 바꿈.
     한 어절이 화면보다 길 때만 body의 overflow-wrap:anywhere 가 글자 단위로 끊어 줌 */
  word-break: keep-all;
  line-break: strict;
  text-wrap: balance; /* 마지막 어절만 다음 줄로 떨어지지 않게 줄 길이를 고르게 */
}
.phrase .say { font-size: calc(20px * var(--font-scale)); color: var(--terra); font-weight: 700; }
.speech-help {
  margin: 12px 0 4px;
  padding: 14px 14px 12px;
  border-left: 3px solid var(--terra);
  background: var(--terra-tint);
  border-radius: 2px;
  text-align: left;
  width: 100%;
  max-width: 420px;
}
.speech-help p { margin: 0 0 10px; font-weight: 700; color: var(--terra-dark); }
.speech-help .small { margin: 8px 0 0; font-weight: 400; color: var(--muted); }
.phrase .tip { margin: 6px 0 0; font-size: calc(16px * var(--font-scale)); color: var(--muted); line-height: 1.6; }
.phrase .btn-row { margin-top: 14px; }

/* 상황별 바로가기 (크기 고정) */
.jump { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 0 0 8px; }
.jump button {
  min-width: 0;
  min-height: 48px;
  border: 1.5px solid var(--navy);
  border-radius: var(--r-btn);
  background: transparent;
  font-size: 17px;
  font-weight: 700;
  white-space: nowrap;
  padding: 0;
}
.phrase-group { scroll-margin-top: 70px; } /* 상단 고정 바에 가리지 않게 */
.group-title {
  font-family: var(--serif);
  font-size: 24px;
  font-weight: 800;
  margin: 28px 0 0;
  padding: 10px 0 4px;
  border-bottom: 2px solid var(--navy);
  color: var(--navy);
}
.phrase-group .phrase:first-of-type { border-top: 0; padding-top: 14px; }
/* 두 버튼은 글씨를 키워도 한 줄·같은 높이로 나란히 */
.phrase .btn {
  min-width: 0;
  min-height: 56px;
  padding: 10px 6px;
  gap: 6px;
  font-size: clamp(16px, calc(17px * var(--font-scale)), 18px);
  white-space: nowrap;
}

.showcase {
  position: fixed;
  inset: 0;
  z-index: 60;
  background: var(--paper);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 24px 20px calc(24px + env(safe-area-inset-bottom));
  text-align: center;
  gap: 18px;
}
.showcase .ja { word-break: keep-all; line-break: strict; text-wrap: balance; font-family: var(--ja); font-size: clamp(40px, 12vw, 64px); line-height: 1.35; font-weight: 800; }
.showcase .ko { font-size: 22px; color: var(--muted); }
.showcase .btn { max-width: 360px; }

/* ---------- 엔화 계산기 ---------- */
.calc-display {
  border-top: 2px solid var(--navy);
  border-bottom: 2px solid var(--navy);
  padding: 14px 2px;
  text-align: right;
  font-variant-numeric: tabular-nums;
}
.calc-display .yen { font-size: 24px; font-weight: 700; color: var(--muted); overflow-wrap: break-word; }
/* 결과 금액: 긴 숫자도 잘리지 않게 폭에 맞춰 줄이고, 그래도 넘치면 줄바꿈 */
.calc-display .krw {
  font-family: var(--serif);
  font-size: clamp(30px, 10vw, 48px);
  line-height: 1.2;
  font-weight: 800;
  margin-top: 2px;
  color: var(--navy);
  overflow-wrap: break-word;
  word-break: break-all;
}
.calc-display .krw small { font-size: 0.5em; font-weight: 700; }
.calc-display .rate { font-size: 15px; color: var(--muted); margin-top: 6px; text-align: left; }

.quick { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 16px 0 10px; }
.quick button {
  min-height: 56px;
  border-radius: var(--r-btn);
  border: 1.5px solid var(--terra);
  background: transparent;
  color: var(--terra-dark);
  font-weight: 800;
  font-size: 17px;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
  padding: 0 2px;
}
.quick button.reset { background: var(--navy); border-color: var(--navy); color: var(--white); }
/* 키패드: 흰 상자 대신 종이 위 가는 테두리 */
.keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.keypad button {
  min-height: 64px;
  border-radius: var(--r-btn);
  border: 1px solid var(--rule);
  background: transparent;
  font-size: 28px;
  font-weight: 700;
  color: var(--ink);
  font-variant-numeric: tabular-nums;
}
.keypad button:active { background: var(--paper-2); }
.keypad .fn { font-size: 18px; background: var(--paper-2); }
.keypad .danger { color: var(--terra); }

.rate-edit { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 10px; }
.rate-edit input {
  flex: 1;
  min-width: 120px;
  min-height: 56px;
  border-radius: var(--r);
  border: 1.5px solid var(--muted);
  padding: 0 14px;
  font-size: 20px;
  background: transparent;
}
.rate-edit .btn { width: auto; min-width: 96px; }

.check-item {
  display: flex;
  gap: 14px;
  width: 100%;
  text-align: left;
  border: 0;
  border-top: 1px solid var(--rule);
  background: transparent;
  padding: 18px 0;
}
.check-item:first-of-type { border-top: 0; padding-top: 4px; }
.check-box {
  flex: none;
  width: 32px;
  height: 32px;
  margin-top: 3px;
  border-radius: var(--r);
  border: 2px solid var(--muted);
  display: grid;
  place-items: center;
  font-size: 19px;
  font-weight: 900;
  color: var(--white);
}
.check-item[aria-pressed="true"] .check-box { background: var(--terra); border-color: var(--terra); }
.check-item .ct { display: block; font-size: calc(20px * var(--font-scale)); font-weight: 800; margin: 0 0 4px; line-height: 1.45; }
.check-item .cd { display: block; color: #43392f; }

/* ---------- 가족 암호 잠금 화면 (크기 고정) ---------- */
.lock {
  max-width: 420px;
  margin: 0 auto;
  min-height: 100dvh;
  padding: max(40px, env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));
  display: flex;
  flex-direction: column;
  justify-content: center;
}
.lock-title {
  font-family: var(--serif);
  font-size: 30px;
  line-height: 1.3;
  font-weight: 800;
  text-align: center;
  margin: 0;
  color: var(--navy);
}
.lock-guide {
  margin: 12px 0 0;
  text-align: center;
  font-size: 19px;
  font-weight: 700;
  color: var(--navy);
}
.kakao-text { margin: 14px 0 22px; text-align: center; font-size: 18px; line-height: 1.7; color: var(--ink); }
.lock-hint {
  margin: 8px 0 0;
  text-align: center;
  font-size: 17px;
  font-weight: 600;
  color: var(--terra);
}
.lock-dots { display: flex; justify-content: center; gap: 18px; margin: 28px 0 6px; }
.lock-dots span {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  border: 2.5px solid var(--navy);
}
.lock-dots span.on { background: var(--navy); }
.lock-error {
  min-height: 30px;
  margin: 6px 0 14px;
  text-align: center;
  font-size: 18px;
  font-weight: 800;
  color: #c0271b; /* 빨간 안내 (미색 바탕 대비 5:1 이상) */
}
.lock .keypad button { min-height: 70px; font-size: 30px; }
.lock .keypad .fn { font-size: 18px; }
.shake { animation: shake 0.35s; }
@keyframes shake {
  25% { transform: translateX(-8px); }
  50% { transform: translateX(8px); }
  75% { transform: translateX(-4px); }
}
@media (prefers-reduced-motion: reduce) { .shake { animation: none; } }

/* ---------- 암호 ---------- */
.gate-dots { display: flex; justify-content: center; gap: 12px; margin: 12px 0 16px; }
.gate-dots span { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--ink); }
.gate-dots span.on { background: var(--ink); }

/* ---------- 하단 탭 ---------- */
.tabbar {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 40;
  background: var(--paper);
  border-top: 1px solid var(--rule);
  padding-bottom: env(safe-area-inset-bottom);
}
.tabbar-inner { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); }
.tabbar button {
  min-height: var(--tabbar-h);
  border: 0;
  border-radius: 0;
  background: transparent;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  font-size: 15px;
  font-weight: 700;
  color: var(--muted);
  padding: 4px 2px 6px;
  line-height: 1.2;
  white-space: nowrap; /* 하단 탭: 크기 고정 + 줄바꿈 금지 */
  min-width: 0;
}
.tabbar button svg { width: 26px; height: 26px; }
/* 고른 탭: 네이비 글자 + 글자 아래 2px 밑줄 (알약·색 상자 없음) */
.tabbar button[aria-current="page"] {
  color: var(--navy);
  font-weight: 800;
  text-decoration: underline;
  text-decoration-thickness: 2px;
  text-underline-offset: 5px;
}

/* 버튼 속 선 아이콘 (소리 듣기) */
.btn .ico { width: 22px; height: 22px; flex: none; }

.colophon {
  margin-top: 36px;
  padding-top: 18px;
  border-top: 1px solid var(--rule);
  text-align: center;
  font-size: 15px;
  line-height: 1.6;
  color: var(--muted);
}
.colophon .credit { font-size: 13px; margin-top: 6px; }
.colophon .copyright { margin: 6px 0 0; font-size: 13px; line-height: 1.6; color: #7a7267; }
.credit-list { margin-top: 6px; font-size: 13px; text-align: left; }
.credit-list summary { text-align: center; cursor: pointer; padding: 8px 0; min-height: 44px; }
.credit-list ul { margin: 4px 0 0; padding-left: 18px; line-height: 1.5; }
.credit-list li + li { margin-top: 4px; }

.app { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.tabbar { padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.fs-bar-inner { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
</style>
